# Store og små bogstaver er ligegyldige. Hold forklaringen kort: den vises ved hover og fokus.
DataFrame: "En tabel i pandas: rækker er observationer, kolonner er variable. Svarer til en data frame i R."
kolonne: "Én variabel i tabellen, fx alder. I pandas kaldes en enkelt kolonne en Series."
variabel: "Et navn, I sætter på en værdi, så maskinen kan gemme den og I kan hente den frem igen."
objekt: "En værdi sammen med de ting, den kan gøre. I Python er næsten alt et objekt."
type: "Det, en værdi er: fx heltal (int), kommatal (float) eller tekst (str). Typen afgør, hvad man kan gøre med værdien."
funktion: "En navngiven opskrift: tager noget ind (argumenter), gør noget, og giver et resultat tilbage."
argument: "Det, I giver en funktion i parentesen, fx tallet 2 i round(3.14159, 2)."
metode: "En funktion, der hører til et objekt og kaldes med punktum: objekt.metode()."
bibliotek: "En samling færdige funktioner, som andre har skrevet, fx pandas. Hentes med import."
boolean: "En logisk værdi, der kun kan være True eller False. Svaret på et ja/nej-spørgsmål."
vektoriseret: "Én instruks, der virker på en hel kolonne på én gang, i stedet for én værdi ad gangen."
algoritme: "En præcis trin for trin-opskrift, der løser et problem."
løkke: "Kode, der gentager de samme linjer for hvert element, ét ad gangen (for ... in ...)."
notebook: "Et dokument, hvor tekst og kørbar kode står side om side i celler."
celle: "Én blok i en notebook. Kodeceller kan køres; resultatet vises lige under."
fortolker: "Programmet, der læser jeres Python-kode linje for linje og får maskinen til at udføre den."
indeks: "Rækkernes etiket i en DataFrame. Som udgangspunkt tallene 0, 1, 2 ..."
