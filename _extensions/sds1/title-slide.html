<section id="title-slide" class="quarto-title-block lay-titel">
  <div class="titel-ramme">
    <div>
      $if(subtitle)$<p class="chip">$subtitle$</p>$endif$
      <h1 class="title">$title$</h1>
      <p class="titel-kursus">SDS1 · Social Data Science I</p>
      $if(by-author)$<p class="titel-forfatter">$for(by-author)$$it.name.literal$$sep$ · $endfor$$if(date)$ · $date$$endif$</p>$endif$
      <span class="aau-logo" role="img" aria-label="Aalborg Universitet"></span>
      <p class="titel-hjaelp"><kbd>→</kbd> næste slide · <kbd>M</kbd> menu · <kbd>F</kbd> fuld skærm · <kbd>?</kbd> alle genveje</p>
    </div>
    <div class="titel-qr">
      <p class="qr-tekst">Åbn slides på din egen computer</p>
      <div id="sds1-qr" role="img" aria-label="QR-kode med link til disse slides"></div>
      <a id="sds1-link" href="#"></a>
    </div>
  </div>
</section>
